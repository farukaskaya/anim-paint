name: Build Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-appimage:
    name: Linux AppImage (x86_64)
    # Ubuntu 22.04 keeps the AppImage compatible with older glibc systems.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev ffmpeg librsvg2-bin zip

      - name: Build AppImage
        run: |
          chmod +x packaging/build-appimage.sh packaging/build-windows.sh packaging/AppRun
          VERSION="${VERSION#v}" packaging/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows-exe:
    name: Windows EXE (x86_64)
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf
            make
            zip

      - name: Build Windows executable
        run: |
          chmod +x packaging/build-windows.sh
          VERSION="${VERSION#v}" packaging/build-windows.sh

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux-appimage, windows-exe]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.exe
            dist/*.zip
          fail_on_unmatched_files: false
